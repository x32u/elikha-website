<!doctype html>
<html lang="en">
  <body style="font-family: Arial, sans-serif; color: #171412; line-height: 1.6;">
    <h2 style="color: #1800ad;">Reset your e-Likha password</h2>
    <p>Enter this 6-digit code on the e-Likha password reset screen:</p>
    <p style="font-size: 30px; font-weight: 700; letter-spacing: 8px; color: #1800ad;">
      {{ .Token }}
    </p>
    <p>This code expires shortly and can only be used once.</p>
    <p>If you did not request a password reset, you can safely ignore this email.</p>
  </body>
</html>
